# The persist filesystem mounted at /var/lib/tee is owned by root, while
# tee-supplicant runs as teesuppl and keeps the OP-TEE REE FS storage there.
[Unit]
RequiresMountsFor=/var/lib/tee

[Service]
ExecStartPre=+/bin/chown teesuppl:teesuppl /var/lib/tee
ExecStartPre=+/bin/chmod 0700 /var/lib/tee
