#@TYPE: Machine
#@NAME: Qualcomm Eliza Evaluation Kit (EVK) eMMC with open boot firmware support
#@DESCRIPTION: Machine configuration for Qualcomm Eliza Evaluation Kit (EVK) eMMC, booting TF-A, OP-TEE and U-Boot

require conf/machine/eliza-evk-emmc.conf

PREFERRED_PROVIDER_virtual/kernel = "linux-qcom-eliza"

KERNEL_DEVICETREE += " \
    qcom/eliza-cqs-evk-emmc-el2.dtb \
    qcom/eliza-cqs-evk-emmc-el2-imx577-camera.dtb \
    qcom/eliza-cqs-evk-emmc-el2-imx577-ov9282-camera.dtb \
"

EXTRA_IMAGEDEPENDS += "trusted-firmware-a-qcom-eliza"

MACHINE_FEATURES += "optee"
MACHINE_EXTRA_RRECOMMENDS += "${@bb.utils.contains('BBFILE_COLLECTIONS', 'meta-arm', 'packagegroup-optee', '', d)}"

PREFERRED_PROVIDER_virtual/bootloader = "u-boot-qcom"

UBOOT_CONFIG = "eliza-evk"

QCOM_TFA_FIP_FLASH = "1"
QCOM_TFA_RECIPE = "trusted-firmware-a-qcom-eliza"

QCOM_UKI_DEVICETREE = "eliza-cqs-evk-emmc-el2-imx577-ov9282-camera.dtb"
