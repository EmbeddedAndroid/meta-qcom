name: Commit Policy
run-name: "Commit policy: ${{ github.event.pull_request.title }}"

# Review every pull request's commits against the contribution policy in
# AGENTS.md and post the result as a review. This complements the build jobs
# in pr.yml; it runs for documentation-only changes too, because the
# commit-message rules apply regardless of which files change.

on:
  pull_request_target:
    branches:
      - master
      - wrynose
      # review-check is the integration branch used to test this workflow;
      # drop it when upstreaming.
      - review-check

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: commit-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  commit-policy:
    uses: EmbeddedAndroid/commit-policy-action/.github/workflows/commit-policy.yml@v1
    with:
      action-ref: v1
      cc-allow-components: "ci"
