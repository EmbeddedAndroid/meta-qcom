# TF-A answers SMCCC SOC_ID, so with this set the SMCCC SoC device takes
# soc0 and /sys/devices/soc0/soc_id reads "jep106:0070:02dc"; QAIRT parses
# soc0/soc_id as a number and aborts (std::invalid_argument stoi). The
# stock Qualcomm TZ does not implement SOC_ID, so stock images keep
# socinfo as soc0.
# CONFIG_ARM_SMCCC_SOC_ID is not set
